version : 2

sources:
  - name: raw
    schema: gz_raw_data
    description: raw tables
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: sales informations of greenweenz platform   
        columns:
          - name: orders_id
            description: unique id of sales
            tests:
               - unique:
                   arguments:
                      column_name: "orders_id || '-' || pdt_id "
               - not_null 
      - name: product
        identifier: raw_gz_product
        description: product informations of greenwenz platfom
        columns:
          - name: products_id
            description: unique id of products
            tests:
               - unique
               - not_null 
      - name: ship
        identifier: raw_gz_ship 
        description: shipping information of greenwenz platform
        columns:
          - name: orders_id
            description: unique id of ship
            tests:
               - unique
               - not_null
      - name: adwords
        identifier: raw_gz_adwords 
        description: adwords information of greenwenz platform   
      - name: bing
        identifier: raw_gz_bing
        description: bing information of greenwenz platform 
      - name: criteo
        identifier: raw_gz_criteo 
        description: criteo information of greenwenz platform               
      - name: facebook
        identifier: raw_gz_facebook
        description: facebook information of greenwenz platform      

models:
  - name: int_campaigns
    description: all informations for each company
    columns:
      - name: paid_source
        tests:
          - not_null       
      
      - name: campaign_name
        tests:
          - not_null
      
      - name: campaign_key
        tests:
           - unique:
                   arguments:
                      column_name: "campaign_key || '-' || date_date " 
                      
  - name: finance_campaigns_day
    description: >
      Daily finance view combining finance KPIs with marketing campaign metrics.
      Built by joining finance_days with int_campaigns_day on date_date.
      ads_margin is calculated as operational_margin - ads_cost.
    columns:
      - name: date
        description: Day of aggregation.
        tests:
          - not_null
          - unique

      - name: ads_margin
        description: Operational margin after subtracting advertising cost (operational_margin - ads_cost).

      - name: average_basket
        description: Average basket value (revenue / number of transactions).

      - name: operational_margin
        description: Operational margin (margin + shipping_fee - log_cost - ship_cost).

      - name: ads_cost
        description: Total advertising cost for the day.

      - name: ads_impression
        description: Total ad impressions for the day.

      - name: ads_clicks
        description: Total ad clicks for the day.

      - name: quantity
        description: Total quantity sold for the day.

      - name: revenue
        description: Total revenue for the day.

      - name: purchase_cost
        description: Total purchase cost for the day.

      - name: margin
        description: Total margin for the day (revenue - purchase_cost).

      - name: shipping_fee
        description: Total shipping fees charged to customers for the day.

      - name: log_cost
        description: Total logistics cost for the day.

      - name: ship_cost
        description: Total shipping cost paid by the company for the day.